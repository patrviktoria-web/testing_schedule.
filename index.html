<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система тестування та сповіщень</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f7f6; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; margin-bottom: 20px; }
        
        /* Стилі для блоку дня народження */
        .bday-card { background: linear-gradient(135deg, #ffeaa7 0%, #ffb8b8 100%); border: none; display: none; /* ховаємо за замовчуванням, якщо іменинників немає */ }
        .bday-title { color: #d35400; font-size: 1.4rem; margin-top: 0; }
        .bday-names { font-size: 1.2rem; font-weight: bold; color: #2c3e50; margin: 10px 0; line-height: 1.4; }
        .bday-wishes { font-style: italic; color: #4b6584; font-size: 0.95rem; }

        h1 { color: #2c3e50; font-size: 1.5rem; }
        .date { color: #7f8c8d; margin-bottom: 1.5rem; font-weight: 500; }
        .btn { display: inline-block; background: #27ae60; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background: #219150; }
        .error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="card bday-card" id="bday-area">
    <h2 class="bday-title">🎉 День народження! 🎈</h2>
    <div class="bday-names" id="bday-list"></div>
    <p class="bday-wishes">Бажаємо міцного здоров'я, мирного неба та перемоги!🫡🇺🇦</p>
</div>

<div class="card" id="app">
    <h1 id="test-name">Завантаження...</h1>
    <p class="date" id="current-date"></p>
    <div id="action-area"></div>
</div>

<script>
    // 1. Посилання на ТЕСТИ (твоє поточне)
    const CSV_TESTS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8iK5FkrenX4xD6Tjqee6_3so8v-JgoBTFbMGK-yiY9Xcskh7wbokA1cAN6TRe3cU_ZT2pfqMwthv7/pub?gid=0&single=true&output=csv';

    // 2. ЗАМІНИ ЦЕ ПОСИЛАННЯ на посилання з другого аркуша (Дні Народження)
    // Тобто треба опублікувати другий аркуш як CSV і вставити його сюди (зміниться gid=XXXXX)
    const CSV_BDAYS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8iK5FkrenX4xD6Tjqee6_3so8v-JgoBTFbMGK-yiY9Xcskh7wbokA1cAN6TRe3cU_ZT2pfqMwthv7/pub?gid=873818035&single=true&output=csv';

    // Отримуємо поточну дату один раз для обох функцій
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const todayStr = `${day}.${month}`; // Формат "31.05"

    document.getElementById('current-date').innerText = `Сьогодні: ${todayStr}`;

    // ФУНКЦІЯ 1: ЗАВАНАТАЖЕННЯ ТЕСТІВ
    async function loadTestData() {
        try {
            const response = await fetch(CSV_TESTS_URL);
            const data = await response.text();
            const rows = data.split('\n').map(row => row.split(','));

            const todayRow = rows.find(row => row[0] && row[0].trim() === todayStr);

            const titleEl = document.getElementById('test-name');
            const areaEl = document.getElementById('action-area');

            if (todayRow) {
                titleEl.innerText = todayRow[1]; 
                const url = todayRow[2].trim();  
                areaEl.innerHTML = `<a href="${url}" class="btn" target="_blank">Відкрити тест</a>`;
            } else {
                titleEl.innerText = "Тестів не знайдено";
                areaEl.innerHTML = `<p class="error">На сьогодні графіком тестування не передбачено.</p>`;
            }
        } catch (error) {
            console.error(error);
            document.getElementById('test-name').innerText = "Помилка зв'язку з тестами";
        }
    }

    // ФУНКЦІЯ 2: ЗАВАНТАЖЕННЯ ДНІВ НАРОДЖЕННЯ
    async function checkBirthdays() {
        if (CSV_BDAYS_URL.startsWith('ПОСИЛАННЯ')) return; // Пропустити, якщо посилання не оновлено

        try {
            const response = await fetch(CSV_BDAYS_URL);
            const data = await response.text();
            
            // Ділимо на рядки
            const rows = data.split('\n').map(row => row.split(','));

            let todaysCelebrants = [];

            rows.forEach(row => {
                if (row.length >= 2) {
                    const name = row[0].trim();
                    const bdayField = row[1].trim();

                    // Оскільки дата може бути "31.05" або "31.05.1990", беремо перші 5 символів (ДД.ММ)
                    const bdayShort = bdayField.substring(0, 5);

                    if (bdayShort === todayStr && name !== "") {
                        todaysCelebrants.push(name);
                    }
                }
            });

            // Якщо знайшли іменинників, показуємо картку привітання
            if (todaysCelebrants.length > 0) {
                const bdayArea = document.getElementById('bday-area');
                const bdayList = document.getElementById('bday-list');
                
                // Виводимо іменинників (кожного з нового рядка)
                bdayList.innerHTML = todaysCelebrants.join('<br>');
                
                // Робимо блок видимим
                bdayArea.style.display = 'block';
            }
        } catch (error) {
            console.error("Не вдалося завантажити дні народження:", error);
        }
    }

    // Запускаємо обидві функції
    loadTestData();
    checkBirthdays();
</script>

</body>
</html>
